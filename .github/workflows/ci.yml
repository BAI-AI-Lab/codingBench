name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the livecodebench env on the server
      - name: Python syntax
        run: |
          git ls-files '*.py' | while read -r f; do python -m py_compile "$f" || exit 1; done
      - name: Shell syntax
        run: |
          for f in $(git ls-files '*.sh') bin/cb; do bash -n "$f" || exit 1; done
      - name: ShellCheck (errors only)
        run: shellcheck -S error $(git ls-files '*.sh') bin/cb

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: LiveCodeBench report
        run: python tests/test_lcb_report.py
      - name: LiveCodeBench re-judge checkers
        run: python tests/test_lcb_rejudge.py
      - name: Static quality parsers
        run: python tests/test_lcb_quality.py
      - name: Code performance tables
        run: python tests/test_lcb_perf.py
      - name: Latency, token and cost report
        run: python tests/test_lcb_usage.py
      - name: Streamed requests (fake streams)
        run: |
          python -m pip install -q openai==3.35.1 httpx==0.28.1   # the versions in the livecodebench env
          python tests/test_lcb_stream.py
      - name: Ladder pipeline (synthetic problems, native judge, mock endpoint)
        run: python tests/test_ladder.py

  workstation:   # deploy/wsl_setup.sh end to end on Ubuntu (what WSL2 runs) with two USACO problems and a mock model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup (packages, user bench, envs, data, build, calibration, problem list)
        run: |
          zcat samples/ladder_download.tsv.gz | grep -E "usaco/(1443|1541)/|usaco/pages/" | gzip > /tmp/part.tsv.gz
          sudo env LADDER_LIST=/tmp/part.tsv.gz CB=/opt/code_bench bash deploy/wsl_setup.sh
          test -f /opt/code_bench/data/ladder/ladder.json
      - name: cb ladder --smoke against the mock endpoint
        run: |
          CB=/opt/code_bench /opt/code_bench/venvs/ladder/bin/python tests/mock_openai.py --port 18999 &
          sleep 3
          MODEL=mock OPENAI_BASE_URL=http://127.0.0.1:18999/v1 OPENAI_API_KEY=x cb ladder --smoke
          sudo test -f /opt/code_bench/runs/mock/ladder-smoke/report/report.md
          sudo grep -q '"solved": true' /opt/code_bench/runs/mock/ladder-smoke/judge.jsonl

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan every commit, not just the last one
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --verbose
